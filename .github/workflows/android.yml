name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      working-directory: ./frontend
      run: chmod +x gradlew

    - name: Build with Gradle
      working-directory: ./frontend
      run: ./gradlew build

    - name: Run tests
      working-directory: ./frontend
      run: ./gradlew test

    - name: Run lint
      working-directory: ./frontend
      run: ./gradlew lint

    - name: Build debug APK
      working-directory: ./frontend
      run: ./gradlew assembleDebug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: frontend/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Upload lint reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lint-reports
        path: frontend/app/build/reports/lint-results-*.html
        retention-days: 30

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: frontend/app/build/reports/tests/
        retention-days: 30
